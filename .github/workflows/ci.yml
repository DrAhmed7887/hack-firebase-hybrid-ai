name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Leak test (no seeded identifier may reach the cloud call)
        run: npm test
      - name: Bench (rules-only, mock cloud; fails if any payload holds a seeded identifier)
        run: npm run bench
      - name: Bench on 100 seeded notes (rules-only, mock cloud; fails on a leaked payload or if the committed result changes)
        run: npm run bench:100 -- --write && git diff --exit-code docs/bench-100-rules-only.json
      - name: Seeded data is reproducible
        run: node scripts/gen-cases.mjs && git diff --exit-code data/synthetic/cases.json data/synthetic/bench100.json
      - run: npm run build
