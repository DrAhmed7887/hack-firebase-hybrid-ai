<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14">
  <title id="t">Registry Gate data flow</title>
  <desc id="d">A note stays on the device, is masked by rules and Gemini Nano, previewed, checked by the leak guard, then only masked text goes to the cloud Gemini model through Firebase AI Logic; results are rehydrated locally.</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
  <rect x="10" y="30" width="590" height="200" rx="10" fill="#eef6ee" stroke="#4a8a4a"/>
  <text x="20" y="52" font-weight="600">On the device (raw note never leaves)</text>
  <rect x="370" y="30" width="520" height="0" fill="none"/>
  <rect x="25" y="85" width="105" height="70" rx="8" fill="#fff" stroke="#333"/><text x="77" y="115" text-anchor="middle">Synthetic</text><text x="77" y="135" text-anchor="middle">note</text>
  <rect x="160" y="85" width="130" height="70" rx="8" fill="#fff" stroke="#333"/><text x="225" y="112" text-anchor="middle">Mask: rules +</text><text x="225" y="132" text-anchor="middle">Nano (ONLY_ON_DEVICE)</text>
  <rect x="320" y="85" width="115" height="70" rx="8" fill="#fff" stroke="#333"/><text x="377" y="112" text-anchor="middle">Preview:</text><text x="377" y="132" text-anchor="middle">human reads</text>
  <rect x="465" y="85" width="120" height="70" rx="8" fill="#fff3d6" stroke="#b07a00"/><text x="525" y="112" text-anchor="middle">Leak guard</text><text x="525" y="132" text-anchor="middle">aborts if ID left</text>
  <rect x="640" y="85" width="145" height="70" rx="8" fill="#e8f0ff" stroke="#2f5db3"/><text x="712" y="112" text-anchor="middle">Cloud Gemini</text><text x="712" y="132" text-anchor="middle">(PREFER_IN_CLOUD)</text>
  <text x="712" y="190" text-anchor="middle">masked text only</text>
  <path d="M130,120 H158 M290,120 H318 M435,120 H463 M585,120 H638" stroke="#333" fill="none" marker-end="url(#a)"/>
  <path d="M712,155 V215 H77 V160" stroke="#333" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="400" y="208" text-anchor="middle">JSON back, tokens restored locally, export</text>
</svg>
